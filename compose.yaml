services:
  postgres:
    image: postgres:18
    container_name: postgres_lab
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      #- "4534:5432"
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - catalogo-network

volumes:
  postgres-data:

networks:
  catalogo-network:
    driver: bridge